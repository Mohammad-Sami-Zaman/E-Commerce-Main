{% extends 'master/base.html' %}


{% block head %}
<title>Product Catagory</title>

<style>
table {
  font-family: Arial, Helvetica, sans-serif;
  border-collapse: collapse;
  width: 100%;
}

td, th {
  border: 1px solid #ddd;
  padding: 8px;
}

tr:nth-child(even){background-color: #f2f2f2;}

tr:hover {background-color: #ddd;}

th {
  padding-top: 12px;
  padding-bottom: 12px;
  text-align: left;
  background-color: #04AA6D;
  color: white;
}
</style>
{% endblock head %}
    


{% block body %}

<h1>Product Catagory</h1>   
<a href="{% url 'catagory_add' %}" class="btn btn-primary">Add</a>

<table>
  <tr>
    <th>Catagory Name</th>
    <th>Description</th>
    <th>Created_at</th>
    <th>Action</th>
  </tr>

  
  {% for pc in data %}

  <tr>
    <td>{{pc.category_name}}</td>
    <td>{{pc.description}}</td>
    <td>{{pc.created_at}}</td>
    <td><a href="{% url 'catagory_edit' pc.id %}" class="btn btn-primary">edit</a>
    <a href="{% url 'catagory_delete' pc.id %}" class="btn btn-danger">Delete</a></td>
  </tr>
    
  {% endfor %}
    
  
 
</table>


{% endblock body %}
